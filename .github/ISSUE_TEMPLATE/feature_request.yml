name: 功能建议 / Feature request
description: 新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 现在哪里不方便或做不到
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 设想的做法
      description: 如果涉及内存、SD 卡数据格式或上游行为，请说明预期的代价

  - type: checkboxes
    id: scope
    attributes:
      label: 确认
      options:
        - label: 这个需求不需要修改上游 HeroesOfJinYong 的玩法逻辑，或者我在上面说明了原因
